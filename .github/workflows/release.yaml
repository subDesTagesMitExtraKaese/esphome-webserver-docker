name: Release

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: Captive Portal
            directory: captive-portal
          - name: Webserver v2
            directory: v2
          - name: Webserver v3
            directory: v3
    steps:
      - name: Clone the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Node.JS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0

      - name: Install dependencies
        run: npm install

      - name: Build ${{ matrix.name }}
        run: npm run build
        working-directory: packages/${{ matrix.directory }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ matrix.name }}
          path: _static/**/*.h

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: static-files
          path: _static/
          if-no-files-found: error

  release:
    name: Tag and Release
    runs-on: ubuntu-latest
    needs: build
    outputs:
      tag: ${{ steps.create_tag.outputs.tag }}
    steps:
      # Checkout repo, create new git tag, and git release with artifacts
      - name: Checkout the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Create a new tag
        id: create_tag
        run: echo tag=$(date +'%Y%m%d-%H%M%S') >> $GITHUB_OUTPUT

      - name: Download Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: headers
          merge-multiple: true

      - name: List files
        run: ls -R headers

      - name: Create a release
        id: create_release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: ${{ steps.create_tag.outputs.tag }}
          name: Release ${{ steps.create_tag.outputs.tag }}
          files: headers/**/*.h
          generate_release_notes: true

  docker-publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: release
    environment:
      name: production
      url: https://ghcr.io/esphome/webserver
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Download static artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: static-files*
          path: _static/
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef  # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4  # v6.15.0
        with:
          context: .
          file: ./Dockerfile.nginx
          push: true
          tags: |
            ghcr.io/esphome/webserver:${{ needs.release.outputs.tag }}
            ghcr.io/esphome/webserver:latest
          platforms: |
            linux/amd64
            linux/arm64/v8
            linux/arm/v7
            linux/ppc64le
            linux/riscv64
            linux/s390x

  esphome-pr:
    name: Make PR into ESPHome repo
    runs-on: ubuntu-latest
    environment: esphome
    needs:
      - release
    steps:
      - name: Checkout esphome repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: esphome/esphome
          ref: dev

      - name: Download Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: /tmp/headers
          merge-multiple: true

      - name: Move headers into palce
        run: |-
          mv /tmp/headers/captive_portal/captive_index.h esphome/components/captive_portal/captive_index.h
          mv /tmp/headers/v2/server_index_v2.h esphome/components/web_server/server_index_v2.h
          mv /tmp/headers/v3/server_index_v3.h esphome/components/web_server/server_index_v3.h

      - name: PR Changes
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676  # v7.0.11
        with:
          commit-message: "Update webserver local assets to ${{ needs.release.outputs.tag }}"
          committer: esphomebot <68923041+esphomebot@users.noreply.github.com>
          author: esphomebot <68923041+esphomebot@users.noreply.github.com>
          branch: sync/webserver-assets
          delete-branch: true
          title: "Update webserver local assets to ${{ needs.release.outputs.tag }}"
          body-path: .github/PULL_REQUEST_TEMPLATE.md
          token: ${{ secrets.ESPHOME_WEBSERVER_SYNC_TOKEN }}
          assignees: "@esphome/core"
