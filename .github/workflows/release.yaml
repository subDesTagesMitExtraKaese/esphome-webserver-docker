name: Release

on:
  push:
    branches:
      - main
    # main only moves via release PRs from dev, but there is no reason to cut a
    # release for a docs-only merge.
    paths:
      - packages/**
      - scripts/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - .nvmrc
      - .github/workflows/release.yaml
      - .github/workflows/build.yaml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    permissions:
      contents: read
    uses: ./.github/workflows/build.yaml

  release:
    name: Tag and Release
    runs-on: ubuntu-latest
    # The paths filter only constrains the push trigger; workflow_dispatch can
    # be run from any ref. Without this, dispatching from a feature branch cuts
    # a real tag and release from unreviewed code.
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.create_tag.outputs.tag }}
      url: ${{ steps.create_release.outputs.url }}
    steps:
      - name: Create a new tag
        id: create_tag
        run: echo "tag=$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: release
          merge-multiple: true

      - name: Create a release
        id: create_release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ steps.create_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.create_tag.outputs.tag }}
          files: |
            release/**/*.h
            release/webserver-v1.*
          generate_release_notes: true
          fail_on_unmatched_files: true

  docker-publish:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    needs: release
    environment:
      name: production
      url: https://hub.docker.com/
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
      - name: Set up Node.JS
        uses: actions/setup-node@v4.0.2
      - name: Install dependencies
        run: npm install
      - name: Build all packages
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.nginx
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/esphome-webserver:${{ needs.release.outputs.tag }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/esphome-webserver:latest
          platforms: |
            linux/amd64
            linux/arm64/v8
            linux/arm/v7
            linux/ppc64le
            linux/riscv64
            linux/s390x

